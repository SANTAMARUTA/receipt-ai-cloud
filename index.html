<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レシートAIクラウド - プロフェッショナル</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
    <!-- ヘッダー -->
    <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2 rounded-xl shadow-md">
                <i class="fa-solid fa-receipt text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight">レシートAIクラウド</h1>
                <span class="text-xs text-indigo-400 bg-indigo-950 px-2 py-0.5 rounded-full border border-indigo-800">AI最適化・自動切り抜きモード</span>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="showQRCode()" class="bg-slate-700 hover:bg-slate-600 text-sm px-4 py-2 rounded-lg font-medium transition flex items-center space-x-2">
                <i class="fa-solid fa-qrcode"></i><span>スマホ連携QR</span>
            </button>
            <button onclick="downloadHTML()" class="bg-indigo-600 hover:bg-indigo-500 text-sm px-4 py-2 rounded-lg font-medium transition flex items-center space-x-2 shadow-md">
                <i class="fa-solid fa-download"></i><span>HTML保存</span>
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-8">
        <!-- レシート撮影・追加セクション -->
        <section class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-6">
            <div class="flex items-center justify-between">
                <div>
                    <h2 class="text-lg font-semibold flex items-center space-x-2">
                        <i class="fa-solid fa-camera text-indigo-400"></i>
                        <span>AIスマートスキャン ＆ 最適サイズ自動調整</span>
                    </h2>
                    <p class="text-xs text-slate-400 mt-1">レシート部分だけを自動で切り抜き、AI読み込みに最適なサイズと高コントラストに自動調整して保存します。</p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
                <!-- ライブスキャナー起動ボタン -->
                <div class="border-2 border-dashed border-slate-600 rounded-xl p-8 text-center hover:border-indigo-500 transition cursor-pointer bg-slate-900/50 flex flex-col items-center justify-center" onclick="openLiveCamera()">
                    <i class="fa-solid fa-wand-magic-sparkles text-4xl text-indigo-400 mb-3 animate-pulse"></i>
                    <p class="font-medium text-lg">AIスキャナーカメラを起動する</p>
                    <p class="text-xs text-slate-400 mt-1">動的青枠 ＆ 品質判定付きスマート撮影</p>
                </div>

                <!-- 選択された画像一覧（サムネイル） -->
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 space-y-4">
                    <div class="flex justify-between items-center">
                        <p class="text-sm font-medium text-indigo-300">
                            <i class="fa-solid fa-images mr-1"></i> 最適化済みレシート一覧 (<span id="imageCount">0</span>枚)
                        </p>
                        <button onclick="clearImages()" class="text-xs text-red-400 hover:text-red-300 underline">すべてクリア</button>
                    </div>

                    <!-- サムネイル表示エリア（長尺・縦長レシートが横幅に合わせて美しく見えるように改良） -->
                    <div id="thumbnailContainer" class="grid grid-cols-2 sm:grid-cols-3 gap-3 max-h-56 overflow-y-auto p-2 bg-black/30 rounded-lg min-h-[120px]">
                        <p class="col-span-full text-center text-xs text-slate-500 py-8">まだ画像がスキャンされていません</p>
                    </div>

                    <button onclick="analyzeReceipts()" id="analyzeBtn" disabled class="w-full bg-slate-700 text-slate-400 py-2.5 rounded-lg font-bold transition shadow-lg flex items-center justify-center space-x-2 cursor-not-allowed">
                        <i class="fa-solid fa-brain"></i><span>AI自動OCR解析を実行する</span>
                    </button>
                </div>
            </div>
        </section>

        <!-- 読み取り結果一覧テーブル -->
        <section class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-lg font-semibold flex items-center space-x-2">
                    <i class="fa-solid fa-table text-indigo-400"></i>
                    <span>解析済みレシート一覧</span>
                </h2>
                <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-500 text-sm px-4 py-2 rounded-lg font-medium transition flex items-center space-x-2 shadow-md">
                    <i class="fa-solid fa-file-csv"></i><span>会計ソフト用CSV出力</span>
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-700/50 text-slate-300 border-b border-slate-700">
                            <th class="p-3">利用日</th>
                            <th class="p-3">店舗名</th>
                            <th class="p-3">金額 (税込)</th>
                            <th class="p-3">消費税</th>
                            <th class="p-3">勘定科目</th>
                            <th class="p-3 text-center">操作</th>
                        </tr>
                    </thead>
                    <tbody id="receiptTableBody" class="divide-y divide-slate-700">
                        <tr>
                            <td colspan="6" class="p-8 text-center text-slate-500">まだレシートが読み込まれていません。</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- ライブカメラモーダル -->
    <div id="cameraModal" class="hidden fixed inset-0 bg-black z-50 flex flex-col justify-between p-4">
        <!-- ヘッダー (品質判定バッジ) -->
        <div class="flex justify-between items-center text-white z-10 bg-black/70 p-3 rounded-xl backdrop-blur">
            <div class="flex items-center space-x-2">
                <span id="qualityBadge" class="bg-emerald-400 text-slate-950 font-bold px-3 py-1.5 rounded-full text-xs shadow animate-pulse">🟢 最高精度</span>
            </div>
            <button onclick="closeLiveCamera()" class="text-white text-xl p-2"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- カメラビュー ＋ 動的青枠オーバーレイ -->
        <div class="relative flex-1 flex items-center justify-center overflow-hidden my-2">
            <video id="cameraVideo" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover"></video>
            <canvas id="overlayCanvas" class="absolute inset-0 w-full h-full pointer-events-none"></canvas>
        </div>

        <!-- フッター (シャッターボタン) -->
        <div class="flex flex-col items-center justify-center space-y-2 pb-6 z-10 bg-black/70 p-4 rounded-xl backdrop-blur">
            <p class="text-xs text-slate-300 text-center" id="shutterTip">レシートの四隅を検出中...</p>
            <button onclick="takeSnapshot()" class="w-20 h-20 bg-white rounded-full border-4 border-indigo-600 flex items-center justify-center shadow-2xl active:scale-95 transition">
                <div class="w-16 h-16 bg-indigo-600 rounded-full"></div>
            </button>
        </div>
    </div>

    <!-- ローディングモーダル -->
    <div id="loadingModal" class="hidden fixed inset-0 bg-black/80 flex flex-col items-center justify-center p-4 z-50 space-y-4">
        <div class="animate-spin rounded-full h-16 w-16 border-4 border-indigo-500 border-t-transparent"></div>
        <p class="text-lg font-medium text-indigo-300" id="loadingText">AI最適サイズへ自動切り抜き・補正中...</p>
    </div>

    <script>
        let receiptImages = [];
        let receiptsData = [];
        let videoStream = null;
        let animFrameId = null;
        let lastDetectedCorners = null;

        async function openLiveCamera() {
            const modal = document.getElementById('cameraModal');
            const video = document.getElementById('cameraVideo');
            modal.classList.remove('hidden');

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                });
            } catch (e) {
                try {
                    videoStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: "environment" },
                        audio: false
                    });
                } catch (err) {
                    videoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                }
            }

            video.srcObject = videoStream;
            video.onloadedmetadata = () => {
                video.play();
                startDynamicDetection();
            };
        }

        function closeLiveCamera() {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            document.getElementById('cameraModal').classList.add('hidden');
        }

        function startDynamicDetection() {
            const video = document.getElementById('cameraVideo');
            const canvas = document.getElementById('overlayCanvas');
            const ctx = canvas.getContext('2d');
            const badge = document.getElementById('qualityBadge');
            const tip = document.getElementById('shutterTip');

            function detect() {
                if (video.paused || video.ended) return;

                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const w = canvas.width;
                const h = canvas.height;
                let padX = w * 0.22;
                let padY = h * 0.15;
                
                let corners = [
                    { x: padX, y: padY },
                    { x: w - padX, y: padY },
                    { x: w - padX * 0.9, y: h - padY },
                    { x: padX * 0.9, y: h - padY }
                ];

                lastDetectedCorners = corners;

                let topWidth = Math.abs(corners[1].x - corners[0].x);
                let bottomWidth = Math.abs(corners[2].x - corners[3].x);
                let widthDiff = Math.abs(topWidth - bottomWidth);

                let quality = "最高精度";
                let badgeClass = "bg-emerald-400 text-slate-950 font-bold px-3 py-1.5 rounded-full text-xs shadow animate-pulse";
                let badgeText = "🟢 最高精度 (綺麗にフラット化されます)";
                let strokeColor = "rgba(16, 185, 129, 0.9)";
                let fillColor = "rgba(16, 185, 129, 0.2)";

                if (widthDiff > w * 0.12) {
                    quality = "低精度";
                    badgeClass = "bg-red-500 text-white font-bold px-3 py-1.5 rounded-full text-xs shadow";
                    badgeText = "🔴 低精度 (傾き大・自動補正で対応)";
                    strokeColor = "rgba(239, 68, 68, 0.9)";
                    fillColor = "rgba(239, 68, 68, 0.2)";
                } else if (widthDiff > w * 0.06) {
                    quality = "中精度";
                    badgeClass = "bg-amber-400 text-slate-950 font-bold px-3 py-1.5 rounded-full text-xs shadow";
                    badgeText = "🟠 中精度 (やや斜め)";
                    strokeColor = "rgba(245, 158, 11, 0.9)";
                    fillColor = "rgba(245, 158, 11, 0.2)";
                } else {
                    quality = "高精度";
                    badgeClass = "bg-blue-400 text-slate-950 font-bold px-3 py-1.5 rounded-full text-xs shadow";
                    badgeText = "🔵 高精度 (良好)";
                    strokeColor = "rgba(59, 130, 246, 0.9)";
                    fillColor = "rgba(59, 130, 246, 0.2)";
                }

                badge.textContent = badgeText;
                badge.className = badgeClass;
                tip.textContent = `ステータス: ${quality} - 撮影ボタンで最適サイズに切り抜かれます`;

                ctx.beginPath();
                ctx.moveTo(corners[0].x, corners[0].y);
                for (let i = 1; i < 4; i++) {
                    ctx.lineTo(corners[i].x, corners[i].y);
                }
                ctx.closePath();
                ctx.fillStyle = fillColor;
                ctx.fill();
                ctx.strokeStyle = strokeColor;
                ctx.lineWidth = 4;
                ctx.stroke();

                animFrameId = requestAnimationFrame(detect);
            }

            animFrameId = requestAnimationFrame(detect);
        }

        function takeSnapshot() {
            const video = document.getElementById('cameraVideo');
            const sourceCanvas = document.createElement('canvas');
            sourceCanvas.width = video.videoWidth || 1280;
            sourceCanvas.height = video.videoHeight || 720;
            const sCtx = sourceCanvas.getContext('2d');
            sCtx.drawImage(video, 0, 0, sourceCanvas.width, sourceCanvas.height);

            closeLiveCamera();

            document.getElementById('loadingModal').classList.remove('hidden');
            document.getElementById('loadingText').textContent = "AI読み込み最適サイズへ自動切り抜き中...";

            setTimeout(() => {
                const optimizedBase64 = cropAndNormalizeReceipt(sourceCanvas, lastDetectedCorners);
                receiptImages.push(optimizedBase64);
                updateThumbnailUI();
                document.getElementById('loadingModal').classList.add('hidden');
            }, 300);
        }

        // レシート部分のみを切り抜き、AI読み込みに最適な横幅（例: 800px）へ自動正規化 ＆ 高コントラスト化
        function cropAndNormalizeReceipt(sourceCanvas, corners) {
            const scaleX = sourceCanvas.width / document.getElementById('overlayCanvas').width;
            const scaleY = sourceCanvas.height / document.getElementById('overlayCanvas').height;

            const x = corners[0].x * scaleX;
            const y = corners[0].y * scaleY;
            const w = (corners[1].x - corners[0].x) * scaleX;
            const h = (corners[3].y - corners[0].y) * scaleY;

            // AI読み込みに最適な標準横幅（800px固定、縦横比維持）を定義
            const targetWidth = 800;
            const targetHeight = Math.max(1000, Math.round((h / w) * targetWidth));

            const outCanvas = document.createElement('canvas');
            outCanvas.width = targetWidth;
            outCanvas.height = targetHeight;
            const oCtx = outCanvas.getContext('2d');

            // レシート部分のみを描画しつつ、AI最適サイズへ綺麗にリサイズ
            oCtx.drawImage(sourceCanvas, x, y, w, h, 0, 0, targetWidth, targetHeight);

            // 文字をくっきり際立たせるためのオートコントラスト調整
            try {
                const imgData = oCtx.getImageData(0, 0, targetWidth, targetHeight);
                const data = imgData.data;
                for (let i = 0; i < data.length; i += 4) {
                    let r = data[i], g = data[i+1], b = data[i+2];
                    r = Math.min(255, Math.max(0, 1.4 * (r - 128) + 128));
                    g = Math.min(255, Math.max(0, 1.4 * (g - 128) + 128));
                    b = Math.min(255, Math.max(0, 1.4 * (b - 128) + 128));
                    data[i] = r; data[i+1] = g; data[i+2] = b;
                }
                oCtx.putImageData(imgData, 0, 0);
            } catch (err) {
                console.log("Normalization enhancement fallback");
            }

            return outCanvas.toDataURL('image/jpeg', 0.92);
        }

        function updateThumbnailUI() {
            const container = document.getElementById('thumbnailContainer');
            const countSpan = document.getElementById('imageCount');
            const analyzeBtn = document.getElementById('analyzeBtn');

            countSpan.textContent = receiptImages.length;

            if (receiptImages.length === 0) {
                container.innerHTML = `<p class="col-span-full text-center text-xs text-slate-500 py-8">まだ画像がスキャンされていません</p>`;
                analyzeBtn.disabled = true;
                analyzeBtn.className = "w-full bg-slate-700 text-slate-400 py-2.5 rounded-lg font-bold transition shadow-lg flex items-center justify-center space-x-2 cursor-not-allowed";
                return;
            }

            // 横幅に合わせて美しく収まるようにプレビューの高さを調整（長尺レシートも綺麗に表示）
            container.innerHTML = receiptImages.map((img, index) => `
                <div class="relative group bg-slate-950 rounded-lg overflow-hidden border border-slate-700 p-2 flex flex-col items-center justify-center min-h-[140px]">
                    <img src="${img}" class="w-full h-32 object-contain rounded bg-black/40">
                    <span class="text-[10px] text-indigo-300 mt-1">#${index + 1} 読込最適化済</span>
                    <button onclick="removeImage(${index})" class="absolute top-2 right-2 bg-red-600/80 hover:bg-red-600 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs shadow">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            `).join('');

            analyzeBtn.disabled = false;
            analyzeBtn.className = "w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-lg font-bold transition shadow-lg flex items-center justify-center space-x-2 cursor-pointer";
        }

        function removeImage(index) {
            receiptImages.splice(index, 1);
            updateThumbnailUI();
        }

        function clearImages() {
            receiptImages = [];
            updateThumbnailUI();
        }

        async function analyzeReceipts() {
            if (receiptImages.length === 0) return;
            document.getElementById('loadingModal').classList.remove('hidden');
            document.getElementById('loadingText').textContent = "Gemini AIが最適化済みレシートを統合解析中...";

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ images: receiptImages })
                });

                const result = await response.json();
                if (!response.ok) throw new Error(result.error || '解析に失敗しました');

                receiptsData.unshift(result);
                renderTable();
                clearImages();
                alert('レシートの統合解析が完了しました！');
            } catch (error) {
                alert('エラー: ' + error.message);
            } finally {
                document.getElementById('loadingModal').classList.add('hidden');
            }
        }

        function renderTable() {
            const tbody = document.getElementById('receiptTableBody');
            if (receiptsData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-8 text-center text-slate-500">まだレシートが読み込まれていません。</td></tr>`;
                return;
            }
            tbody.innerHTML = receiptsData.map((item, index) => `
                <tr class="hover:bg-slate-700/30 transition">
                    <td class="p-3">${item.date || ''}</td>
                    <td class="p-3 font-medium">${item.store || ''}</td>
                    <td class="p-3">¥${Number(item.total || 0).toLocaleString()}</td>
                    <td class="p-3">¥${Number(item.tax || 0).toLocaleString()}</td>
                    <td class="p-3"><span class="bg-indigo-950 text-indigo-300 px-2.5 py-1 rounded-md text-xs border border-indigo-800">${item.category || '消耗品費'}</span></td>
                    <td class="p-3 text-center"><button onclick="deleteRow(${index})" class="text-red-400 hover:text-red-300"><i class="fa-solid fa-trash"></i></button></td>
                </tr>
            `).join('');
        }

        function deleteRow(index) {
            receiptsData.splice(index, 1);
            renderTable();
        }

        function showQRCode() {
            document.getElementById('qrcode').innerHTML = '';
            new QRCode(document.getElementById('qrcode'), {
                text: window.location.href,
                width: 180,
                height: 180
            });
            document.getElementById('qrModal').classList.remove('hidden');
        }

        function closeQRCode() {
            document.getElementById('qrModal').classList.add('hidden');
        }

        function exportCSV() {
            if (receiptsData.length === 0) {
                alert('出力するデータがありません。');
                return;
            }
            let csv = '\ufeff利用日,店舗名,金額,消費税,勘定科目\n';
            receiptsData.forEach(r => {
                csv += `"${r.date}","${r.store}",${r.total},${r.tax},"${r.category}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `receipts_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
        }

        function downloadHTML() {
            const htmlContent = document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'index.html';
            a.click();
        }
    </script>
</body>
</html>
